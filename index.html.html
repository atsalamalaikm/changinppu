html_code = """
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 유형 테스트</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --bg: #f8f9fa;

      --text: #2d3436;

    .progress-bar {
      height: 100%;

    .options {
      display: flex;

    .option-btn {
      width: 100%;

      background: #f1f2f6;
      border: 1px solid var(--border);
      border-radius: 12px;

      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: var(--primary-light);
      color: white;
      border-color: var(--primary-light);
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn-prev {
      padding: 10px 20px;
      background: #dfe6e9;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
    }

    .result-container {
      display: none;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .result-card {
      background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
      color: white;
      padding: 28px 20px;
      border-radius: 16px;
      margin: 20px 0 16px 0;
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }

    /* 유형 별칭을 가장 크게 표시 */
    .result-type-alias {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .result-character {
      font-size: 1.1rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .result-desc {
      text-align: left;
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text);
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    /* 원래 결핍 유형명은 아주 작게 표시 */
    .result-small-type {
      font-size: 0.75rem;
      color: #95a5a6;
      margin-bottom: 24px;
      text-align: center;
    }

    .restart-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>마음 유형 테스트</h1>
    <p>내면의 마음 욕구 분석하기</p>
  </div>

  <div class="progress-bar-container" id="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-area"></div>

  <div class="result-container" id="result-container">
    <div id="result-text-summary" style="font-size: 1.2rem; font-weight: 700; color: #2d3436;"></div>
    
    <div class="result-card">
      <div class="result-type-alias" id="result-alias"></div>
      <div class="result-character" id="result-character"></div>
    </div>

    <div class="result-desc" id="result-desc"></div>
    <div class="result-small-type" id="result-small-type"></div>

    <button class="restart-btn" onclick="restartTest()">다시 테스트하기</button>
  </div>
</div>

<script>
  // 질문 원본 데이터
  const baseQuestions = [
    // 애정 결핍
    { type: '애정 결핍', text: '최근 가까운 사람에게 사랑받고 있다는 확신이 든다.' },
    { type: '애정 결핍', text: '주변 사람이 나에게 관심을 보이지 않으면 서운함을 크게 느낀다.' },
    { type: '애정 결핍', text: '가까운 사람이 나에게 관심 표현을 많이 해주기를 바란다.' },
    
    // 자기 대상 결핍
    { type: '자기 대상 결핍', text: '내 감정을 자세히 설명하지 않아도 알아주는 사람이 곁에 있다.' },
    { type: '자기 대상 결핍', text: '힘든 일이 있을 때 이유를 불문하고 내 편이 되어주는 사람이 곁에 있다.' },
    { type: '자기 대상 결핍', text: '중요한 순간에 나를 이해해 줄 사람이 없는 것처럼 느껴진다.' },

    // 신뢰 결핍
    { type: '신뢰 결핍', text: '친한 사람이라도 나에게 실망을 줄까 봐 걱정될 때가 있다.' },
    { type: '신뢰 결핍', text: '다른 사람의 말을 그대로 믿기보다 숨은 의도를 생각해 보는 편이다.' },
    { type: '신뢰 결핍', text: '누군가와 가까워져도 완전히 마음을 열기는 어렵다.' },

    // 의존성 결핍
    { type: '의존성 결핍', text: '혼자 결정해야 하는 상황이 부담스럽다.' },
    { type: '의존성 결핍', text: '중요한 결정사항에 대해 타인과 의견이 다르더라도 내 선택을 견지할 수 있다.' },
    { type: '의존성 결핍', text: '힘든 일이 생기면 혼자 해결하기보다 누군가에게 의지하고 싶다.' },

    // 소외감 및 사회적 고립
    { type: '소외감 및 사회적 고립', text: '내가 다른 사람들과 잘 어울리지 못한다고 느낄 때가 있다.' },
    { type: '소외감 및 사회적 고립', text: '친구들과 함께 있어도 내가 그들 사이에 완전히 속해 있지 않은 것처럼 느껴질 때가 있다.' },
    { type: '소외감 및 사회적 고립', text: '다른 사람들이 나 없이도 잘 지낼 것 같다는 생각이 들 때가 있다.' },

    // 인정 결핍
    { type: '인정 결핍', text: '다른 사람에게 좋은 평가를 받으면 기분이 크게 좋아진다.' },
    { type: '인정 결핍', text: '다른 사람의 인정 없이는 내가 잘하지 못한 것처럼 느껴진다.' },
    { type: '인정 결핍', text: '다른 사람들이 나를 어떻게 평가하는지 신경 쓰는 편이다.' },

    // 자존감 결핍
    { type: '자존감 결핍', text: '다른 사람과 나를 비교하면서 내가 부족하다고 느낄 때가 있다.' },
    { type: '자존감 결핍', text: '작은 실수를 해도 나 자신을 많이 탓하게 된다.' },
    { type: '자존감 결핍', text: '내가 가진 장점보다 부족한 점이 더 잘 보인다.' }
  ];

  // 각 결핍 유형별 별칭, 캐릭터, 상세 설명 정의
  const typeInfo = {
    '애정 결핍': {
      alias: '<꼬꼬형>',
      character: '타조',
      desc: '사랑과 돌봄, 안정적인 애착을 경험하지 못해 타인의 관심을 과도하게 갈구하거나 반대로 관계를 회피하는 상태입니다.'
    },
    '인정 결핍': {
      alias: '<끼끼형>',
      character: '원숭이',
      desc: '타인에게 가치 있는 존재로 인정받고 싶은 욕구가 채워지지 않아, 성과나 타인의 시선에 집착하게 되는 상태입니다.'
    },
    '소외감 및 사회적 고립': {
      alias: '<또치형>',
      character: '고슴도치',
      desc: '집단이나 타인으로부터 속해 있지 못하다는 느낌을 받으며, 소외되거나 혼자라는 깊은 외로움을 겪는 상태입니다.'
    },
    '자존감 결핍': {
      alias: '<밤또리형>',
      character: '밤톨',
      desc: '스스로를 가치 있는 존재로 여기지 못하고, 내면의 결함이나 수치심 때문에 지속적인 불안을 느끼는 상태입니다.'
    },
    '의존성 결핍': {
      alias: '<삐약형>',
      character: '병아리',
      desc: '주체적으로 서지 못하고 타인에게 전적으로 의존하려 하거나, 혼자서는 아무것도 할 수 없다는 무능감에 빠지는 상태입니다.'
    },
    '자기 대상 결핍': {
      alias: '<펭이형>',
      character: '펭귄',
      desc: '자아가 건강한 형태로 성장하는 데 필수적인 외부 대상의 반응이 발달 과정에서 충분히 제공되지 못해 발생한 심리적 결함 상태를 의미함. 주로 사회에서 동떨어진 것 같은 공허감을 느낌.'
    },
    '신뢰 결핍': {
      alias: '<까까형>',
      character: '선인장',
      desc: '배신, 기만, 혹은 가스라이팅과 같은 경험으로 인해 사람이나 세상을 믿지 못하는 상태입니다. 끊임없이 의심하거나 지나치게 경계하며, 관계에서 스스로를 보호하려 벽을 칩니다.'
    }
  };

  const options = [
    { text: '① 전혀 그렇지 않다', score: 1 },
    { text: '② 그렇지 않은 편이다', score: 2 },
    { text: '③ 보통이다', score: 3 },
    { text: '④ 그런 편이다', score: 4 },
    { text: '⑤ 매우 그렇다', score: 5 }
  ];

  let questions = [];
  let currentIdx = 0;
  let userAnswers = [];

  const quizArea = document.getElementById('quiz-area');
  const progressBar = document.getElementById('progress-bar');
  const resultContainer = document.getElementById('result-container');
  const progressContainer = document.getElementById('progress-container');

  // 배열 순서 무작위 셔플 함수
  function shuffle(array) {
    let copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function initQuiz() {
    // 질문 순서 섞기
    questions = shuffle(baseQuestions);
    userAnswers = new Array(questions.length).fill(0);
    
    quizArea.innerHTML = '';
    questions.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = `question-card ${idx === 0 ? 'active' : ''}`;
      card.id = `q-${idx}`;

      let optionsHtml = options.map((opt) => `
        <button class="option-btn" onclick="selectOption(${idx}, ${opt.score})">
          ${opt.text}
        </button>
      `).join('');

      card.innerHTML = `
        <div class="question-number">Q${idx + 1} / ${questions.length}</div>
        <div class="question-text">${q.text}</div>
        <div class="options">${optionsHtml}</div>
        <div class="btn-group">
          ${idx > 0 ? `<button class="btn-prev" onclick="prevQuestion(${idx})">이전</button>` : '<div></div>'}
        </div>
      `;

      quizArea.appendChild(card);
    });
    updateProgress();
  }

  function updateProgress() {
    const percentage = (currentIdx / questions.length) * 100;
    progressBar.style.width = `${percentage}%`;
  }

  function selectOption(qIdx, score) {
    userAnswers[qIdx] = score;
    
    if (qIdx < questions.length - 1) {
      document.getElementById(`q-${qIdx}`).classList.remove('active');
      currentIdx = qIdx + 1;
      document.getElementById(`q-${currentIdx}`).classList.add('active');
      updateProgress();
    } else {
      showResult();
    }
  }

  function prevQuestion(qIdx) {
    document.getElementById(`q-${qIdx}`).classList.remove('active');
    currentIdx = qIdx - 1;
    document.getElementById(`q-${currentIdx}`).classList.add('active');
    updateProgress();
  }

  function showResult() {
    quizArea.style.display = 'none';
    progressContainer.style.display = 'none';

    // 점수 합산 (역문항 반영 없이 고른 점수 그대로 계산)
    const scores = {};
    questions.forEach((q, idx) => {
      scores[q.type] = (scores[q.type] || 0) + userAnswers[idx];
    });

    // 최고 점수 유형 산출
    let maxType = '';
    let maxScore = -1;

    for (const [type, score] of Object.entries(scores)) {
      if (score > maxScore) {
        maxScore = score;
        maxType = type;
      }
    }

    const info = typeInfo[maxType];

    // 결과 화면 텍스트 반영
    document.getElementById('result-text-summary').innerText = `당신은 ${info.alias} 입니다.`;
    document.getElementById('result-alias').innerText = info.alias;
    document.getElementById('result-character').innerText = `캐릭터: ${info.character}`;
    document.getElementById('result-desc').innerText = info.desc;
    document.getElementById('result-small-type').innerText = `(진단 유형: ${maxType})`;

    resultContainer.style.display = 'block';
  }

  function restartTest() {
    currentIdx = 0;
    resultContainer.style.display = 'none';
    quizArea.style.display = 'block';
    progressContainer.style.display = 'block';
    
    // 다시 시작 시 질문 순서 새로 섞기
    initQuiz();
  }

  // 초기화 및 실행
  initQuiz();
</script>
</body>
</html>
"""

display(HTML(html_code))
